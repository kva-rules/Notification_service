spring:
  application:
    name: notification-service-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-test-group
      auto-offset-reset: earliest

kafka:
  topics:
    notification-events: notification-events-test

jwt:
  secret: test-secret-key-that-is-at-least-32-characters-long-for-testing

logging:
  level:
    root: WARN
    com.cognizant.notificationservice: DEBUG
