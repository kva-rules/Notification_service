server:
  port: 8087

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer prevents poison-pill records from entering an infinite
      # retry loop (and chewing through disk space). Bad records are logged once and skipped.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
  mail:
    host: smtp.gmail.com
    port: 587
    username:
    password:

kafka:
  topics:
    notification-events: notification-events

app:
  email:
    enabled: false
  jwt:
    secret: myVerySecretKeyForJWTThatIsLongEnoughForHS512Signature

jwt:
  secret: myVerySecretKeyForJWTThatIsLongEnoughForHS512Signature

management:
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.cognizant.notificationservice: DEBUG
    org.springframework.security: DEBUG
