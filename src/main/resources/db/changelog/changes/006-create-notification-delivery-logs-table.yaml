databaseChangeLog:
  - changeSet:
      id: 006-create-notification-delivery-logs-table
      author: notification-service
      changes:
        - createTable:
            tableName: notification_delivery_logs
            columns:
              - column:
                  name: delivery_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: notification_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: delivery_type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: attempted_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: text
        - addForeignKeyConstraint:
            baseTableName: notification_delivery_logs
            baseColumnNames: notification_id
            referencedTableName: notifications
            referencedColumnNames: notification_id
            constraintName: fk_delivery_logs_notification
            onDelete: CASCADE
        - createIndex:
            indexName: idx_delivery_logs_notification_id
            tableName: notification_delivery_logs
            columns:
              - column:
                  name: notification_id
        - createIndex:
            indexName: idx_delivery_logs_user_id
            tableName: notification_delivery_logs
            columns:
              - column:
                  name: user_id
